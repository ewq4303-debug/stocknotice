name: Inventory OCR

on:
  push:
    paths:
      - 'inventory_uploads/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventory-ocr
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "anthropic>=0.40.0" "google-genai>=1.0.0"

      - name: Run inventory OCR
        env:
          AI_PROVIDER:       ${{ vars.AI_PROVIDER }}
          CLAUDE_MODEL:      ${{ vars.CLAUDE_MODEL }}
          GEMINI_MODEL:      ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
        run: python inventory_ocr.py

      - name: Commit inventory.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/inventory.json
          git diff --staged --quiet || git commit -m "inventory: update holdings from screenshot"
          git push
